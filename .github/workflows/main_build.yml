name: Build Kuxndbot APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew permissions
        run: |
          gradle wrapper
          chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon -Pandroid.overrideVersionCheck=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kuxndbot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
